kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80    # HTTP — Ingress Controller
        hostPort: 80
        protocol: TCP
      - containerPort: 443   # HTTPS — Ingress Controller
        hostPort: 443
        protocol: TCP
      - containerPort: 30080 # NodePort cho ArgoCD UI
        hostPort: 30080
        protocol: TCP

  # Worker node 1 — run real pods
  - role: worker

  # Worker node 2 — increase capacity
  - role: worker