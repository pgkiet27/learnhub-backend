spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/payment_db}
    username: ${DB_USER:learnhub}
    password: ${DB_PASSWORD:learnhub123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: "SET TimeZone='UTC'"

  jpa:
    hibernate:
      # validate: Hibernate chỉ kiểm tra schema, Flyway quản lý schema
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      # always: hiện chi tiết DB connection, Redis, RabbitMQ status
      # when-authorized: chỉ hiện khi đã auth (dùng production)
      probes:
        enabled: true
        # Bật liveness và readiness probes cho Kubernetes
  health:
    rabbit:
      enabled: true # Kiểm tra RabbitMQ connection
    redis:
      enabled: true # Kiểm tra Redis connection
    db:
      enabled: true # Kiểm tra PostgreSQL connection
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.learnhub: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
