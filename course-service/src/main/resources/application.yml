spring:
  application:
    name: course-service

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/course_db}
    username: ${DB_USER:learnhub}
    password: ${DB_PASSWORD:learnhub123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Production passes SELECT 1: pods already run in UTC and SET would pin RDS Proxy connections
      connection-init-sql: ${DB_CONNECTION_INIT_SQL:SET TimeZone='UTC'}

  jpa:
    hibernate:
      # validate: Hibernate chỉ kiểm tra schema, Flyway quản lý schema
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Propagate trace context through message headers (publish -> consume in one trace)
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      # always: hiện chi tiết DB connection, Redis, RabbitMQ status
      # when-authorized: chỉ hiện khi đã auth (dùng production)
      probes:
        enabled: true
        # Bật liveness và readiness probes cho Kubernetes
  health:
    rabbit:
      enabled: true # Kiểm tra RabbitMQ connection
    redis:
      enabled: true # Kiểm tra Redis connection
    db:
      enabled: true # Kiểm tra PostgreSQL connection
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.learnhub: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

aws:
  region: ${AWS_REGION:ap-southeast-1}
  profile: ${AWS_PROFILE:}
  s3:
    bucket-name: ${AWS_S3_BUCKET:learnhub-media-abc123}
    presigned-url-expiry: 900  # 15 mins (secs)
    max-file-size-mb: 500      # maximum 500MB for video
  cloudfront:
    # e.g. https://d1234abcd.cloudfront.net - empty falls back to the direct S3 URL
    domain: ${CLOUDFRONT_DOMAIN:}

app:
  datasource:
    read:
      # JDBC URL of the read replica; empty keeps every query on the primary (see ReadReplicaDataSourceConfig)
      url: ${DB_READ_URL:}
