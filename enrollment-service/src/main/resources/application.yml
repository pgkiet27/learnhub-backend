spring:
  application:
    name: enrollment-service

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/enrollment_db}
    username: ${DB_USER:learnhub}
    password: ${DB_PASSWORD:learnhub123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: "SET TimeZone='UTC'"

  jpa:
    hibernate:
      # validate: Hibernate only checks the schema, Flyway manages it
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      # always: shows DB connection, Redis, RabbitMQ status in detail
      # when-authorized: only shown once authenticated (used in production)
      probes:
        enabled: true
        # Enable liveness and readiness probes for Kubernetes
  health:
    rabbit:
      enabled: true # Check RabbitMQ connection
    redis:
      enabled: true # Check Redis connection
    db:
      enabled: true # Check PostgreSQL connection
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.learnhub: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

services:
  course:
    base-url: ${COURSE_SERVICE_URL:http://localhost:8083}
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  assessment:
    base-url: ${ASSESSMENT_SERVICE_URL:http://localhost:8087}

churn:
  job:
    enabled: ${CHURN_JOB_ENABLED:true}
    # daily, after the night-time quiet hours (Asia/Ho_Chi_Minh)
    cron: ${CHURN_JOB_CRON:0 0 2 * * *}
  # do not send another reminder email for the same enrollment within this many days
  reminder-cooldown-days: 7
  # training data for the churn model (table churn_feature_snapshots)
  dataset:
    # churn = no lesson activity within this many days after a snapshot
    label-horizon-days: 14
    export:
      enabled: ${CHURN_EXPORT_ENABLED:false}
      bucket: ${CHURN_EXPORT_BUCKET:}
      prefix: ${CHURN_EXPORT_PREFIX:churn}

aws:
  region: ${AWS_REGION:us-east-1}
  profile: ${AWS_PROFILE:}
