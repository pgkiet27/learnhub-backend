name: AI Service CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ai-service/**'
  workflow_dispatch:

env:
  SERVICE: ai-service
  ECR_REPOSITORY: learnhub/ai-service
  AWS_REGION: ap-southeast-1

jobs:
  check:
    name: Install & Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r ai-service/requirements.txt

      - name: Compile sources
        run: python -m compileall -q ai-service/app ai-service/churn_prediction ai-service/index_from_course_db.py

  build-image:
    name: Build & Push Image to ECR
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ai-service

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ env.SERVICE }}'

      - name: Push image
        run: docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Update image tag in infra repo
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${INFRA_REPO_TOKEN}@github.com/pgkiet27/learnhub-infra.git"
          cd learnhub-infra
          git config user.email "ci@learnhub-edu.site"
          git config user.name "LearnHub CI"
          sed -i "s|tag: .*|tag: ${GITHUB_SHA}|g" "helm-charts/${SERVICE}/values.yaml"
          git add "helm-charts/${SERVICE}/values.yaml"
          if git diff --cached --quiet; then
            echo "Image tag already up to date"
            exit 0
          fi
          git commit -m "ci: update ${SERVICE} image to ${GITHUB_SHA}"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          status: ${{ job.status }}
          title: "AI Service — Build & Push"
          description: |
            **Image:** `${{ env.ECR_REPOSITORY }}:${{ github.sha }}`
            **By:** ${{ github.actor }}
