# CI Pipeline — Enrollment Service
# Trigger: push code into enrollment-service/ on branch main/develop
name: Enrollment Service CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      # only trigger when changes are made to enrollment-service hoặc common
      # other services when  push code → this pipeline not run
      - 'enrollment-service/**'
      - 'common/**'
      - '.github/workflows/enrollment-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'enrollment-service/**'
      - 'common/**'

# environment variables for the entire workflow
env:
  JAVA_VERSION: '25'
  IMAGE_NAME: learnhub-enrollment

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # runs-on: GitHub virtual environment provided for running CI

    steps:
      # step 1: Checkout code from repo
      - name: Checkout code
        uses: actions/checkout@v4

      # step 2: install Java 25
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'  # same distribution with Dockerfile
          cache: maven             # Cache Maven dependencies between runs

      # step 3: Build common module first
      # (identity-service depends on common)
      - name: Build Common module
        run: mvn clean install -pl common -DskipTests -B

      # step 4: Run Unit Tests
      - name: Run Unit Tests
        run: mvn test -pl enrollment-service -B
        env:
          # no need real DB for unit tests
          SPRING_PROFILES_ACTIVE: test

      # step 5: Run Integration Tests (needs Docker to run Testcontainers)
      - name: Run Integration Tests
        run: mvn verify -pl enrollment-service -B -Pfailsafe
        # Testcontainers automatically start PostgreSQL in Docker
        # GitHub Actions runner have Docker before

      # Bước 6: SonarQube analysis (code quality)
      - name: SonarQube Analysis
        # only run when push into main (not run for all PR)
        if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -pl enrollment-service \
            -Dsonar.projectKey=learnhub-enrollment \
            -B

      # step 7: Notify Discord when test failed
      - name: Notify Discord — Test Failed
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          status: ${{ job.status }}
          title: "❌ Enrollment Service — Build/Test Failed"
          description: |
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **By:** ${{ github.actor }}
          color: 0xFF0000

  # Job 2: Build and Push Docker Image
  # only run when Job 1 success
  # only run when push into main (not build image for PR)
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test  # Depends on job 1
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # Login into Docker Hub (used when dev, later switch to ECR)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # Create these secrets in GitHub:
          # DOCKERHUB_USERNAME: Docker Hub username
          # DOCKERHUB_TOKEN: Docker Hub access token (Settings → Security)

      # Build and tag Docker image
      # Dùng -f để chỉ định Dockerfile, "." để context là thư mục gốc (mono-repo)
      # Dockerfile tự lo việc build JAR bên trong — không cần build JAR riêng
      # Tag với cả git SHA (bất biến) lẫn "latest" (convenient)
      - name: Build Docker Image
        run: |
          docker build \
            -f enrollment-service/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            .
          # -f enrollment-service/Dockerfile: chỉ định Dockerfile trong service folder
          # "." ở cuối: context là thư mục gốc learnhub-backend/
          # Docker thấy được mvnw, common/, enrollment-service/ và tất cả modules

      # Scan image to find vulnerabilities before pushing
      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'  # 0: không fail build dù có vuln (1: fail nếu có CRITICAL)
          severity: 'CRITICAL,HIGH'

      # Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # Update image tag in learnhub-infra repo (GitOps)
      # ArgoCD will detect this change and deploy automatically
      - name: Update image tag in infra repo
        run: |
          # Clone infra repo
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/your-org/learnhub-infra.git
          cd learnhub-infra

          # Update image tag in values.yaml
          sed -i "s|tag: .*|tag: ${{ github.sha }}|g" \
            helm-charts/enrollment-service/values.yaml

          # Commit and push
          git config user.email "ci@learnhub.vn"
          git config user.name "LearnHub CI"
          git add helm-charts/enrollment-service/values.yaml
          git commit -m "ci: update enrollment-service image to ${{ github.sha }}"
          git push

      # Notify Discord when deploy success
      - name: Notify Discord — Deploy Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          status: success
          title: "✅ Enrollment Service — Build & Push Success"
          description: |
            **Image:** `${{ env.IMAGE_NAME }}:${{ github.sha }}`
            **Branch:** ${{ github.ref_name }}
            **By:** ${{ github.actor }}
          color: 0x10B981

      # Notify Discord when build image fails
      - name: Notify Discord — Build Failed
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          status: failure
          title: "❌ Enrollment Service — Build/Push Failed"
          description: |
            **Branch:** ${{ github.ref_name }}
            **By:** ${{ github.actor }}
          color: 0xFF0000