# CI Pipeline — Payment Service
# Trigger: push code into payment-service/ on branch main/develop
name: Payment Service CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      # only trigger when changes are made to payment-service hoặc common
      # other services when  push code → this pipeline not run
      - 'payment-service/**'
      - 'common/**'
      - '.github/workflows/payment-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'payment-service/**'
      - 'common/**'

# environment variables for the entire workflow
env:
  JAVA_VERSION: '25'
  IMAGE_NAME: learnhub-payment

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # runs-on: GitHub virtual environment provided for running CI

    steps:
      # step 1: Checkout code from repo
      - name: Checkout code
        uses: actions/checkout@v7

      # step 2: install Java 25
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'  # same distribution with Dockerfile
          cache: maven             # Cache Maven dependencies between runs

      # Bước 3:
      # Bước 3a: Install Parent POM into Maven cache
      - name: Install Parent POM
        run: mvn install -N -DskipTests -B
        # -N: non-recursive, only install root POM, not build child modules

      # Bước 3b: Install Common module
      - name: Install Common module
        run: mvn clean install -pl common -DskipTests -B

      # step 4: Run Unit Tests
      - name: Run Unit Tests
        run: mvn test -pl payment-service -B
        env:
          # no need real DB for unit tests
          SPRING_PROFILES_ACTIVE: test

      # step 5: Run Integration Tests (needs Docker to run Testcontainers)
      - name: Run Integration Tests
        run: mvn verify -pl payment-service -B
        env:
          SPRING_PROFILES_ACTIVE: integration-test
          TESTCONTAINERS_RYUK_DISABLED: true
        # Testcontainers automatically start PostgreSQL in Docker
        # GitHub Actions runner have Docker before

      # Bước 6: SonarQube analysis (code quality)
      - name: SonarQube Analysis
        # only run when push into main (not run for all PR)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -pl payment-service \
            -am \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=learnhub-payment \
            -Dsonar.projectName="LearnHub Payment Service" \
            -Dsonar.branch.name=main \
            -B

      # step 7: Notify Discord when test failed
      - name: Notify Discord — Test Failed
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          status: ${{ job.status }}
          title: "❌ Payment Service — Build/Test Failed"
          description: |
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **By:** ${{ github.actor }}
          color: 0xFF0000

  # Job 2: Build and Push Docker Image
  # only run when Job 1 success
  # only run when push into main (not build image for PR)
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test  # Depends on job 1
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      security-events: write  # Upload SARIF to Security tab is required
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # Login into Docker Hub (used when dev, later switch to ECR)
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # Create these secrets in GitHub:
          # DOCKERHUB_USERNAME: Docker Hub username
          # DOCKERHUB_TOKEN: Docker Hub access token (Settings → Security)

      # Build and tag Docker image
      # Dùng -f để chỉ định Dockerfile, "." để context là thư mục gốc (mono-repo)
      # Dockerfile tự lo việc build JAR bên trong — không cần build JAR riêng
      # Tag với cả git SHA (bất biến) lẫn "latest" (convenient)
      - name: Build Docker Image
        run: |
          docker build \
            -f payment-service/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            .
          # -f payment-service/Dockerfile: chỉ định Dockerfile trong service folder
          # "." ở cuối: context là thư mục gốc learnhub-backend/
          # Docker thấy được mvnw, common/, payment-service/ và tất cả modules

      # Scan image to find vulnerabilities before pushing
      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ env.IMAGE_NAME }}'
          # category: distinguish results of each service in Security tab

      # Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # Update image tag in learnhub-infra repo (GitOps)
      # ArgoCD will detect this change and deploy automatically
      - name: Update image tag in infra repo
        run: |
          # Clone infra repo
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/pgkiet27/learnhub-infra.git
          cd learnhub-infra

          # Update image tag in values.yaml
          sed -i "s|tag: .*|tag: ${{ github.sha }}|g" \
            helm-charts/payment-service/values.yaml

          # Commit and push
          git config user.email "ci@learnhub.vn"
          git config user.name "LearnHub CI"
          git add helm-charts/payment-service/values.yaml
          git commit -m "ci: update payment-service image to ${{ github.sha }}"
          git push

      # Notify Discord when deploy success
      - name: Notify Discord — Deploy Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          status: success
          title: "✅ Payment Service — Build & Push Success"
          description: |
            **Image:** `${{ env.IMAGE_NAME }}:${{ github.sha }}`
            **Branch:** ${{ github.ref_name }}
            **By:** ${{ github.actor }}
          color: 0x10B981

      # Notify Discord when build image fails
      - name: Notify Discord — Build Failed
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          status: failure
          title: "❌ Payment Service — Build/Push Failed"
          description: |
            **Branch:** ${{ github.ref_name }}
            **By:** ${{ github.actor }}
          color: 0xFF0000