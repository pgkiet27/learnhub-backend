# use for unit tests — no need real infrastructure
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false  # turnoff Flyway, H2 automatically create schema
  rabbitmq:
    host: localhost
    port: 5672
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://example.com/.well-known/jwks.json

jwt:
  secret: test-secret-key-minimum-256-bits-for-hmac-sha-algorithm
  access-token-expiry: 3600
  refresh-token-expiry: 2592000

cognito:
  user-pool-id: ap-southeast-1_test
  client-id: test-client-id
  client-secret: test-client-secret
  region: ap-southeast-1