spring:
  application:
    name: notification-service

  config:
    import: optional:file:./.env[.properties]

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Retry transient failures (SMTP, user lookups), then drop the message instead of requeueing forever
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

  # Local dev: Mailpit (docker-compose.apps.yml) catches every email, UI at http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8086

notification:
  mail:
    from: ${MAIL_FROM:LearnHub <no-reply@learnhub.local>}
  # Base URL used in email links
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

services:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false # a slow SMTP server should not mark the service down
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.learnhub: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
