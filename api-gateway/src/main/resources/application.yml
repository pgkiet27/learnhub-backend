spring:
  application:
    name: api-gateway

  config:
    import: optional:file:./.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:3000}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/users/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**

        # /api/v1/internal/** (service-to-service) is intentionally NOT routed
        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/categories/**,/api/v1/coupons/**,/api/v1/courses/**,/api/v1/lessons/**,/api/v1/questions/**,/api/v1/answers/**,/api/v1/admin/courses/**

        - id: enrollment-service
          uri: ${ENROLLMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/enrollments/**,/api/v1/my-learning/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**,/api/v1/admin/payments/**

server:
  port: 8080

gateway:
  jwt:
    # Must be the same secret identity-service uses to sign LearnHub access tokens
    secret: ${JWT_SECRET:learnhub-super-secret-key-change-in-production-must-be-256-bits}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.learnhub: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
